<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YADOBA — Giriş</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f0f4ff;
  --card: #ffffff;
  --text: #0f172a;
  --muted: #64748b;
  --border: #e2e8f0;
  --primary: #1e40af;
  --primary-h: #1d4ed8;
  --error: #dc2626;
  --error-bg: #fef2f2;
  --input-bg: #f8fafc;
  --demo-bg: #f8fafc;
}
[data-theme=dark] {
  --bg: #0f172a;
  --card: #1e293b;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --border: #334155;
  --primary: #3b82f6;
  --primary-h: #60a5fa;
  --error: #f87171;
  --error-bg: #450a0a;
  --input-bg: #0f172a;
  --demo-bg: #0f172a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Plus Jakarta Sans',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:20px;
  transition:background .25s,color .25s;
}
/* Animated background blobs */
.blobs{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.blob{
  position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;
  animation:float 8s ease-in-out infinite;
}
.blob1{width:400px;height:400px;background:#3b82f6;top:-100px;left:-100px;animation-delay:0s}
.blob2{width:350px;height:350px;background:#8b5cf6;bottom:-80px;right:-80px;animation-delay:3s}
.blob3{width:250px;height:250px;background:#06b6d4;top:50%;left:50%;animation-delay:5s;transform:translate(-50%,-50%)}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-20px) scale(1.05)}}
[data-theme=dark] .blob{opacity:.15}

.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:24px;padding:40px;width:100%;max-width:420px;
  box-shadow:0 24px 48px -8px rgba(0,0,0,.12);
  position:relative;z-index:1;
}
.theme-btn{
  position:absolute;top:16px;right:16px;
  width:36px;height:36px;border:1px solid var(--border);
  background:var(--bg);color:var(--muted);border-radius:9px;
  cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;
  transition:background .15s,border-color .15s;
}
.theme-btn:hover{background:var(--border)}

.logo{display:flex;align-items:center;gap:14px;margin-bottom:32px}
.logo-icon{
  width:54px;height:54px;
  background:linear-gradient(135deg,#1e40af,#3b82f6);
  border-radius:15px;display:flex;align-items:center;justify-content:center;
  color:#fff;
  box-shadow:0 8px 20px -4px rgba(59,130,246,.45);
  flex-shrink:0;
}
.logo-info h1{font-size:22px;font-weight:800;letter-spacing:-.5px;color:var(--text)}
.logo-info p{font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}

.section-title{
  font-size:12px;font-weight:700;text-transform:uppercase;
  letter-spacing:.8px;color:var(--muted);margin-bottom:20px;
}
.form-group{margin-bottom:16px}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.input-wrap{position:relative}
input[type=text],input[type=password]{
  width:100%;padding:12px 14px;
  border:1.5px solid var(--border);border-radius:10px;
  background:var(--input-bg);color:var(--text);
  font-family:inherit;font-size:15px;outline:none;
  transition:border-color .2s,box-shadow .2s;
}
input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.15)}

.eye-btn{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;color:var(--muted);
  font-size:16px;padding:4px;
}

.error-box{
  display:none;background:var(--error-bg);color:var(--error);
  font-size:13px;font-weight:500;padding:10px 14px;
  border-radius:9px;margin-bottom:16px;
  border:1px solid rgba(220,38,38,.2);
}
.error-box.show{display:flex;align-items:center;gap:8px}

.btn-login{
  width:100%;padding:14px;
  background:linear-gradient(135deg,#1e40af,#3b82f6);
  color:#fff;border:none;border-radius:11px;
  font-family:inherit;font-size:15px;font-weight:700;
  cursor:pointer;transition:opacity .2s,transform .1s,box-shadow .2s;
  box-shadow:0 4px 14px rgba(59,130,246,.35);
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-login:hover{opacity:.92;box-shadow:0 6px 18px rgba(59,130,246,.45)}
.btn-login:active{transform:scale(.98)}
.btn-login:disabled{opacity:.6;cursor:not-allowed}

.toggle-link{
  text-align:center;margin-top:18px;font-size:13.5px;color:var(--muted);
}
.toggle-link a{
  color:var(--primary);font-weight:600;cursor:pointer;text-decoration:none;
}
.toggle-link a:hover{text-decoration:underline}

.divider{border:none;border-top:1px solid var(--border);margin:24px 0}

.demo-box{background:var(--demo-bg);border:1px solid var(--border);border-radius:12px;padding:14px}
.demo-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:10px}
.demo-row{
  display:flex;align-items:center;gap:10px;
  padding:7px 9px;border-radius:8px;cursor:pointer;
  transition:background .15s;
}
.demo-row:hover{background:var(--border)}
.badge{
  font-size:10px;font-weight:700;padding:2px 8px;
  border-radius:20px;text-transform:uppercase;white-space:nowrap;
}
.b-admin{background:#dbeafe;color:#1e40af}
.b-student{background:#dcfce7;color:#166534}
[data-theme=dark] .b-admin{background:#1e3a8a;color:#93c5fd}
[data-theme=dark] .b-student{background:#052e16;color:#86efac}
.demo-cred{font-family:monospace;font-size:12.5px;color:var(--muted)}

.spinner{
  width:16px;height:16px;border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;border-radius:50%;
  animation:spin .7s linear infinite;display:inline-block;
}
@keyframes spin{to{transform:rotate(360deg)}}

footer{
  margin-top:24px;font-size:12px;color:var(--muted);
  text-align:center;position:relative;z-index:1;
}
</style>
</head>
<body>
<div class="blobs">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
</div>

<div class="card">
  <button class="theme-btn" id="themeBtn">🌙</button>

  <div class="logo">
    <div class="logo-icon"><svg width="32" height="32" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M10 4C10 4 7.5 3.2 5 3.8C4.4 3.9 4 4.4 4 5V16C4 16.6 4.5 17 5.1 16.8C7.5 16.2 10 17 10 17V4Z" fill="white"/><path d="M10 4C10 4 12.5 3.2 15 3.8C15.6 3.9 16 4.4 16 5V16C16 16.6 15.5 17 14.9 16.8C12.5 16.2 10 17 10 17V4Z" fill="rgba(255,255,255,0.6)"/><line x1="5.8" y1="7.2" x2="8.5" y2="7.2" stroke="#1e3a8a" stroke-width="1.2" stroke-linecap="round"/><line x1="5.8" y1="9.5" x2="8.5" y2="9.5" stroke="#1e3a8a" stroke-width="1.2" stroke-linecap="round"/><line x1="5.8" y1="11.8" x2="7.5" y2="11.8" stroke="#1e3a8a" stroke-width="1.2" stroke-linecap="round"/><path d="M12.5 8.5 C12.5 7.7 13.2 7 14 7 C14.8 7 15.5 7.7 15.5 8.5 V10 C15.5 10.8 14.8 11.5 14 11.5 C13.2 11.5 12.5 10.8 12.5 10 Z" fill="rgba(255,255,255,0.85)"/><path d="M12 10.5 C12 11.9 12.9 13 14 13 C15.1 13 16 11.9 16 10.5" stroke="rgba(255,255,255,0.85)" stroke-width="1.1" fill="none" stroke-linecap="round"/><line x1="14" y1="13" x2="14" y2="14.2" stroke="rgba(255,255,255,0.85)" stroke-width="1.1" stroke-linecap="round"/><line x1="12.8" y1="14.2" x2="15.2" y2="14.2" stroke="rgba(255,255,255,0.85)" stroke-width="1.1" stroke-linecap="round"/></svg></div>
    <div class="logo-info">
      <h1>YADOBA</h1>
      <p>YADOBA 2.0 — Okuma Değerlendirme Sistemi</p>
    </div>
  </div>

  <!-- GİRİŞ FORMU -->
  <div id="loginSection">
    <div class="section-title">Hesabınıza Giriş Yapın</div>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Kullanıcı Adı</label>
        <input type="text" id="username" placeholder="kullanici_adi" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">Şifre</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" class="eye-btn" id="eyeBtn">👁</button>
        </div>
      </div>
      <div class="error-box" id="errorBox">
        <span>⚠️</span><span id="errorText"></span>
      </div>
      <button type="submit" class="btn-login" id="loginBtn">Giriş Yap</button>
    </form>
    <div class="toggle-link">Hesabın yok mu? <a onclick="showRegister()">Kayıt Ol</a></div>
  </div>

  <!-- KAYIT FORMU -->
  <div id="registerSection" style="display:none">
    <div class="section-title">Yeni Hesap Oluştur</div>
    <form id="registerForm">
      <div class="form-group">
        <label for="reg_fullname">Ad Soyad</label>
        <input type="text" id="reg_fullname" placeholder="Adınız Soyadınız" autocomplete="name" required>
      </div>
      <div class="form-group">
        <label for="reg_username">Kullanıcı Adı</label>
        <input type="text" id="reg_username" placeholder="kullanici_adi (en az 3 karakter)" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="reg_password">Şifre</label>
        <div class="input-wrap">
          <input type="password" id="reg_password" placeholder="En az 6 karakter" autocomplete="new-password" required>
          <button type="button" class="eye-btn" id="eyeBtn2">👁</button>
        </div>
      </div>
      <div class="form-group">
        <label for="reg_password2">Şifre Tekrar</label>
        <input type="password" id="reg_password2" placeholder="Şifreyi tekrar girin" autocomplete="new-password" required>
      </div>
      <div class="error-box" id="regErrorBox">
        <span>⚠️</span><span id="regErrorText"></span>
      </div>
      <button type="submit" class="btn-login" id="registerBtn">Kayıt Ol</button>
    </form>
    <div class="toggle-link">Zaten hesabın var mı? <a onclick="showLogin()">Giriş Yap</a></div>
  </div>
</div>

<footer>YADOBA © 2025 — YADOBA 2.0 / TÜBİTAK 1501<br><span style="font-size:11px;opacity:.7">🌐 <a href="http://localhost:8000" style="color:inherit">http://localhost:8000</a></span></footer>

<script>
// Theme
const themeBtn = document.getElementById('themeBtn');
const root = document.documentElement;
const savedTheme = localStorage.getItem('theme') || 'light';
root.setAttribute('data-theme', savedTheme);
themeBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
themeBtn.addEventListener('click', () => {
  const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  themeBtn.textContent = next === 'dark' ? '☀️' : '🌙';
});

// Şifre göster/gizle
document.getElementById('eyeBtn').addEventListener('click', () => {
  const inp = document.getElementById('password');
  inp.type = inp.type === 'password' ? 'text' : 'password';
});
document.getElementById('eyeBtn2').addEventListener('click', () => {
  const inp = document.getElementById('reg_password');
  inp.type = inp.type === 'password' ? 'text' : 'password';
});

// Bölüm değiştirme
function showLogin() {
  document.getElementById('loginSection').style.display = '';
  document.getElementById('registerSection').style.display = 'none';
  hideRegError();
}
function showRegister() {
  document.getElementById('loginSection').style.display = 'none';
  document.getElementById('registerSection').style.display = '';
  hideError();
}

function showError(msg) {
  document.getElementById('errorText').textContent = msg;
  document.getElementById('errorBox').classList.add('show');
}
function hideError() { document.getElementById('errorBox').classList.remove('show'); }

function showRegError(msg) {
  document.getElementById('regErrorText').textContent = msg;
  document.getElementById('regErrorBox').classList.add('show');
}
function hideRegError() { document.getElementById('regErrorBox').classList.remove('show'); }

function saveAndRedirect(data) {
  localStorage.setItem('auth_token', data.token);
  localStorage.setItem('user', JSON.stringify(data.user));
  window.location.href = data.user.role === 'admin' ? '/admin.html' : '/reading.html';
}

// Giriş formu
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  hideError();
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Giriş yapılıyor...';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, password})
    });
    if (res.ok) {
      saveAndRedirect(await res.json());
    } else {
      const err = await res.json().catch(() => ({}));
      showError(err.detail || 'Kullanıcı adı veya şifre hatalı.');
      btn.disabled = false;
      btn.textContent = 'Giriş Yap';
    }
  } catch {
    showError('Sunucuya bağlanılamadı.');
    btn.disabled = false;
    btn.textContent = 'Giriş Yap';
  }
});

// Kayıt formu
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const full_name = document.getElementById('reg_fullname').value.trim();
  const username  = document.getElementById('reg_username').value.trim();
  const password  = document.getElementById('reg_password').value;
  const password2 = document.getElementById('reg_password2').value;
  const btn = document.getElementById('registerBtn');
  hideRegError();

  if (password !== password2) { showRegError('Şifreler eşleşmiyor.'); return; }
  if (password.length < 6)    { showRegError('Şifre en az 6 karakter olmalı.'); return; }
  if (username.length < 3)    { showRegError('Kullanıcı adı en az 3 karakter olmalı.'); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Kaydediliyor...';
  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({full_name, username, password})
    });
    if (res.ok) {
      saveAndRedirect(await res.json());
    } else {
      const err = await res.json().catch(() => ({}));
      showRegError(err.detail || 'Kayıt başarısız.');
      btn.disabled = false;
      btn.textContent = 'Kayıt Ol';
    }
  } catch {
    showRegError('Sunucuya bağlanılamadı.');
    btn.disabled = false;
    btn.textContent = 'Kayıt Ol';
  }
});

// Auto-redirect
const token = localStorage.getItem('auth_token');
if (token) {
  const user = JSON.parse(localStorage.getItem('user') || '{}');
  if (user.role) window.location.href = user.role === 'admin' ? '/admin.html' : '/reading.html';
}
</script>
</body>
</html>
